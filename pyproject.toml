[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frutlups"
version = "0.3.2"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.3,<7"]

[project.scripts]
frutlups = "frutlups.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "text_defined: seat failure case defined by the text rules of contracts 3.8 (D016); no recorded sample",
]

[tool.ruff]
line-length = 100
