[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frutlups"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.3,<7"]

[project.scripts]
frutlups = "frutlups.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unverified_until_m004: text-defined seat failure case awaiting real qualification",
]

[tool.ruff]
line-length = 100
