# Frutlups layout config for artifact-first template v2.
# This file is documentation-as-data; manual operation remains valid without
# frutlups installed.

schema_version: frutlups_layout_config_v0
profile_id: artifact_first_template_v2
profile_status: stable
template_root: "."
path_resolution: >
  All paths in this config are relative to template_root: the directory frutlups
  is pointed at. In a project created from this template, that is the repository
  root.

purpose:
  summary: >
    Describe the artifact rails frutlups should use when operating on the v2
    template without hardcoding folder names, prompt markers, or report suffixes.
  manual_operation_must_remain_valid: true

compatibility:
  frutlups_source: null
  guide: "docs/template_framework/frutlups_driver_boundary.md"
  current_package_support: "supported for core layout/profile discovery"

workspace_map:
  context_filename: "CONTEXT.md"
  current_state_file: "PROJECT_STATE.md"
  required_for_base_profile:
    - "00_brief"
    - "03_experiments"
    - "05_governance"
    - "prompts"
    - "questions"
  optional_workspaces:
    data: "01_data"
    analysis: "02_analysis"
    delivery: "04_delivery"
    infra: "06_infra"
    app: "07_app"
    package: "08_pkg"
    ops: "09_ops"
    legacy_review: "90_legacy_review"
    memory: "memory"
  profile_rules_doc: "docs/template_framework/project_profiles.md"

state:
  canonical_file: "PROJECT_STATE.md"
  contract_doc: "docs/template_framework/project_state_contract.md"
  mode_fields:
    memory:
      label: "Memory mode"
      allowed_values:
        - "none"
        - "lightweight"
        - "llloom"
      default: "none"
      modes_doc: "docs/template_framework/memory_modes.md"
    frutlups:
      label: "Frutlups mode"
      allowed_values:
        - "manual"
        - "semi-manual"
        - "automated driver"
      default: "manual"
      modes_doc: "docs/template_framework/frutlups_modes.md"
  current_truth_fields:
    - "Project profile"
    - "Active workspaces"
    - "Optional inactive workspaces"
    - "Current objective"
    - "Current loop mode"
    - "Current ceremony level"
    - "Memory mode"
    - "Frutlups mode"
    - "Latest accepted review"
    - "Next expected action"
    - "Validation command"

roadmaps:
  directory: "03_experiments"
  active_roadmap_glob: "*active_roadmap*.md"
  development_roadmap_glob: "*development_roadmap*.md"
  fallback_roadmap_glob: "*roadmap*.md"
  first_roadmap_created_by: "initialization/007_architect_reviewer_project_intake_questionnaire.md"
  slice_fields_expected:
    - "objective"
    - "expected artifacts"
    - "active workspaces"
    - "non-goals"
    - "verification/evidence"
    - "review strictness level"
    - "likely first coding prompt path"

prompts:
  root_dir: "prompts"
  coding_prompt_dir: "prompts/for_coding_agent"
  review_prompt_dir: "prompts/for_review_agent"
  templates_dir: "prompts/templates"
  coding_template: "prompts/templates/coding_prompt.md"
  review_template: "prompts/templates/review_prompt.md"
  self_report_schema: "prompts/templates/self_report.md"
  filename_pattern: "{sequence:03d}_{slug}.md"
  numbering: "zero-padded sequential"
  coder_may_create_review_prompt: "only when the active prompt or project convention explicitly allows it"
  required_coding_prompt_sections:
    - "Current State"
    - "Active Workspaces"
    - "Read First"
    - "Task"
    - "Non-Goals"
    - "Verification"
    - "Self-Report"
    - "Definition Of Done"
  required_review_prompt_sections:
    - "Review Objective"
    - "Read First"
    - "Review Checks"
    - "Verification"
    - "Output"
    - "Non-Goals"
    - "Definition Of Done"
  section_roles:
    required_reading: "Read First"
    self_report: "Self-Report"
    non_goals: "Non-Goals"
    task: "Task"
    verification: "Verification"
  metadata:
    parse_front_matter: true
    milestone_field: "milestone"
    slice_field: "slice"
    title_field: "title"

reports:
  reviews_dir: "05_governance/reviews"
  self_report_suffix: "_self_report.md"
  review_report_suffix: "_review_report.md"
  verdict_record_suffix: "_verdict_record.md"
  review_output_shape_doc: "05_governance/current/review_protocol.md"
  self_report_required_headings:
    - "Intent"
    - "Files Changed"
    - "Behavior Implemented"
    - "Tests Added Or Updated"
    - "Verification Run"
    - "Definition Of Done Audit"
    - "Non-Goals Confirmed"
    - "Memory Used"
    - "Memory Update Requested"
    - "Known Limits / Follow-Up"
    - "Recommended Next Move"
  verdict_values:
    - "pass"
    - "needs_work"
    - "blocked"
    - "override"

governance:
  current_dir: "05_governance/current"
  review_protocol: "05_governance/current/review_protocol.md"
  memory_posture: "05_governance/current/memory_posture.md"
  frutlups_posture: "05_governance/current/frutlups_posture.md"
  known_divergences: "05_governance/current/known_divergences.md"
  human_owner_notes_dir: "05_governance/human_owner_notes"

optional_lanes:
  pattern_doc: "docs/template_framework/optional_lanes.md"
  llloom:
    default_mode: "none"
    posture_file: "05_governance/current/memory_posture.md"
    install_source: null
    install_source_note: "project-specific; do not assume a local path"
    normal_coder_posture: "read-only"
  frutlups:
    default_mode: "manual"
    posture_file: "05_governance/current/frutlups_posture.md"
    driver_boundary_doc: "docs/template_framework/frutlups_driver_boundary.md"

validation:
  command: "python -m unittest discover -s tests"
  tests_dir: "tests"
  note: >
    command and tests_dir are relative to template_root.
  optional_tools_must_not_be_imported_by_scaffold_tests:
    - "llloom"
    - "frutlups"

automation_boundary:
  runner_implemented: false
  boundary_doc: "docs/template_framework/frutlups_driver_boundary.md"
  may_consume:
    - "frutlups status --json"
  must_stop_on:
    - "blocked"
    - "override required"
    - "invalid self-report"
    - "invalid review report"
    - "no frontier"
    - "memory gate failure"
    - "environment gate failure"

git_policy:
  default: "architect-reviewer commits accepted milestones"
  commit_boundary: "positive milestone verdict"
  policy_doc: "docs/template_framework/method.md"
  default_committer_role: "architect_reviewer"
  coder_may_commit_by_default: false
  architect_reviewer_may_commit_at_boundary: true
  runner_may_commit: false
  runner_may_commit_when_explicitly_authorized: true
  runner_may_report_commit_ready: true
  commit_ready_requires:
    - "accepted review or verdict"
    - "validation command passed or failure documented"
    - "PROJECT_STATE.md updated when relevant"
  before_commit_requires:
    - ".gitignore checked and updated if needed"
    - "git status reviewed"
    - "no credentials, raw private data, local state, caches, or generated test output staged"
    - "only accepted milestone changes staged"
    - "staged diff reviewed"
    - "validation command passed or failure documented"
  auto_commit_requires_explicit_configuration: true
  must_not_bypass_stop_conditions_to_commit: true

pull_request_policy:
  default: "human-controlled"
  suggested_boundary: "completed roadmap or human-defined work package"
  policy_doc: "docs/template_framework/method.md"
  human_may_request_any_time: true
  runner_may_open_pull_request: false
  runner_may_report_pull_request_ready: true
  open_pull_request_requires_explicit_authorization: true
  must_not_bypass_stop_conditions_to_open_pull_request: true
